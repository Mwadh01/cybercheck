<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الفحوصات</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
.box{max-width:800px;margin:40px auto;background:#1e293b;padding:24px;border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:right}
a{color:#93c5fd}
</style>
</head>
<body>
<div class="box">
  <h1>📋 سجل الفحوصات</h1>
  <table>
    <thead><tr><th>الهدف</th><th>النوع</th><th>النتيجة</th><th>التاريخ</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p><a href="/">← الرئيسية</a> | <a href="/dashboard">لوحة التحكم</a></p>
</div>
<script>
const names = {safe:"🟢 آمن", suspicious:"🟡 مشبوه", danger:"🔴 خطر", pending:"⏳ قيد الفحص"};
fetch("/api/history").then(r => r.json()).then(list => {
  const tb = document.getElementById("rows");
  list.forEach(s => {
    const tr = document.createElement("tr");
    [s.target, s.kind === "url" ? "رابط" : "ملف", names[s.status] || s.status, s.date].forEach(t => {
      const td = document.createElement("td");
      td.textContent = t;
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
});
</script>
</body>
</html>
