<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberCheck - فحص الروابط والملفات</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
  .box{max-width:600px;margin:40px auto;background:#1e293b;padding:24px;border-radius:12px}
  h1{text-align:center;margin-top:0}
  input[type=text]{width:100%;padding:12px;border-radius:8px;border:0;box-sizing:border-box;margin-bottom:10px}
  button{background:#3b82f6;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;width:100%;font-size:16px}
  hr{border:0;border-top:1px solid #334155;margin:20px 0}
  #result{margin-top:20px;padding:16px;border-radius:8px;display:none;text-align:center;font-size:18px}
  .safe{background:#166534}.suspicious{background:#a16207}.danger{background:#991b1b}.wait{background:#334155}
  nav{text-align:center;margin-top:16px}nav a{color:#93c5fd;margin:0 8px}
</style>
</head>
<body>
<div class="box">
  <h1>🛡️ CyberCheck</h1>
  <input type="text" id="url" placeholder="ضع الرابط المشكوك فيه هنا https://...">
  <button onclick="scanUrl()">فحص الرابط</button>
  <hr>
  <input type="file" id="file"><br><br>
  <button onclick="scanFile()">فحص الملف</button>
  <div id="result"></div>
  <nav><a href="/dashboard">لوحة التحكم</a><a href="/history">السجل</a></nav>
</div>

<script>
const box = document.getElementById("result");

function show(cls, text){
  box.style.display = "block";
  box.className = cls;
  box.textContent = text;
}

async function scanUrl(){
  const url = document.getElementById("url").value.trim();
  show("wait", "⏳ جاري الفحص...");
  const r = await fetch("/api/scan-url", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({url})
  });
  const d = await r.json();
  if(d.error) return show("danger", d.error);
  poll(d.id);
}

async function scanFile(){
  const f = document.getElementById("file").files[0];
  if(!f) return show("danger", "اختر ملفاً أولاً");
  show("wait", "⏳ جاري رفع الملف وفحصه...");
  const fd = new FormData();
  fd.append("file", f);
  const r = await fetch("/api/scan-file", {method:"POST", body: fd});
  const d = await r.json();
  if(d.error) return show("danger", d.error);
  poll(d.id);
}

async function poll(id){
  const r = await fetch("/api/result/" + id);
  const d = await r.json();
  if(!d.done) return setTimeout(() => poll(id), 3000);
  const icons = {safe:"🟢", suspicious:"🟡", danger:"🔴"};
  show(d.status, icons[d.status] + " " + d.message);
}
</script>
</body>
</html>
