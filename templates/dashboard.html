<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
.box{max-width:700px;margin:40px auto;background:#1e293b;padding:24px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{padding:20px;border-radius:10px;text-align:center;font-size:18px;background:#334155}
.card b{display:block;font-size:32px;margin-top:6px}
.safe{background:#166534}.suspicious{background:#a16207}.danger{background:#991b1b}
a{color:#93c5fd}
</style>
</head>
<body>
<div class="box">
  <h1>📊 لوحة التحكم</h1>
  <div class="grid">
    <div class="card">إجمالي الفحوصات<b id="total">0</b></div>
    <div class="card safe">🟢 آمن<b id="safe">0</b></div>
    <div class="card suspicious">🟡 مشبوه<b id="suspicious">0</b></div>
    <div class="card danger">🔴 خطر<b id="danger">0</b></div>
  </div>
  <p><a href="/">← الرئيسية</a> | <a href="/history">السجل</a></p>
</div>
<script>
fetch("/api/stats").then(r => r.json()).then(s => {
  for (const k in s) document.getElementById(k).textContent = s[k];
});
</script>
</body>
</html>
